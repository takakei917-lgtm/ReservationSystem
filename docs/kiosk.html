<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【店頭用】順番待ち受付</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    :root { --primary: #059669; --bg: #f0fdf4; --card-bg: #ffffff; --text: #0f172a; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1, h2 { text-align: center; color: var(--primary); }
    .card { background: var(--card-bg); padding: 25px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .input-group { display: flex; flex-direction: column; gap: 15px; margin-bottom: 15px; }
    
    /* 入力エリアの調整 */
    input[type="text"], input[type="number"], select { 
      padding: 12px; 
      border: 2px solid #a7f3d0; 
      border-radius: 8px; 
      font-size: 18px; 
      box-sizing: border-box;
    }
    .input-name { width: 100%; }

    /* 人数選択（ボタン＆数値入力）のスタイル */
    .count-selection-label { font-size: 14px; color: #047857; font-weight: bold; margin-bottom: -5px; }
    .count-btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .count-btn {
      flex: 1;
      min-width: 50px;
      padding: 12px 5px;
      background-color: #fff;
      color: var(--primary);
      border: 2px solid #a7f3d0;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .count-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .input-custom-count {
      margin-top: 8px;
      width: 100%;
    }

    /* 手書きキャンバス用スタイル */
    .canvas-container { text-align: center; }
    canvas { border: 2px solid #a7f3d0; border-radius: 8px; background: #fff; touch-action: none; cursor: crosshair; }
    .canvas-tools { display: flex; justify-content: space-between; align-items: center; margin-top: 5px; }
    .btn-clear { background-color: #64748b; font-size: 12px; padding: 6px 12px; border: none; color: white; border-radius: 4px; cursor: pointer; width: auto; }

    .btn-submit { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; }
    .status-box { text-align: center; padding: 15px; background-color: #d1fae5; border-radius: 8px; }
    .status-number { font-size: 36px; font-weight: bold; color: var(--primary); }
    .cancel-notice { font-size: 14px; color: #475569; text-align: center; margin-top: 15px; padding-top: 10px; border-top: 1px dashed #a7f3d0; font-weight: bold; }
    .limit-notice { background-color: #fee2e2; border: 1px solid #ef4444; color: #991b1b; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    .closed-notice { background-color: #f3f4f6; border: 1px solid #9ca3af; color: #374151; padding: 15px; border-radius: 8px; text-align: center; font-weight: bold; margin-bottom: 15px; }
    
    ul { list-style: none; padding: 0; }
    li { 
      padding: 12px; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px;
      word-break: break-all;
    }
    li.next-item { font-weight: bold; background-color: #ecfdf5; border-radius: 6px; border-left: 5px solid var(--primary); }
    .badge-next { background-color: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; display: inline-block; }
    .hold-card { border: 1px solid #fed7aa; background-color: #fff7ed; }
    .hold-badge { background-color: #f97316; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; display: inline-block; }
    
    .customer-info { flex-grow: 1; display: flex; align-items: center; gap: 8px; }
    .name-img { max-height: 40px; vertical-align: middle; }
    .nobreak { white-space: nowrap; }
    .time-info { white-space: nowrap; flex-shrink: 0; }

    @media (max-width: 480px) {
      li {
        flex-direction: column;
        align-items: flex-start;
      }
      .time-info {
        align-self: flex-end;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🏪 店頭受付（順番待ち登録）</h1>

  <div class="card">
    <h2>お名前と人数を入力してください</h2>
    
    <div id="closedNotice" class="closed-notice" style="display: none;">
      本日の営業・受付はすべて終了いたしました。
    </div>

    <div id="limitNotice" class="limit-notice" style="display: none;">
      受付上限人数（<span id="maxLimitDisplay">50</span>名）に達したため、現在の受付は一時的に終了いたしました。
    </div>

    <div id="formContainer">
      <div class="input-group">
        <div>
          <input type="text" id="userName" class="input-name" placeholder="お名前（キーボード入力）">
        </div>

        <!-- 人数選択エリア -->
        <div>
          <div class="count-selection-label">👥 人数を選択してください：</div>
          <div class="count-btn-group" id="countBtnGroup" style="margin-top: 8px;">
            <button type="button" class="count-btn active" data-value="1">1名</button>
            <button type="button" class="count-btn" data-value="2">2名</button>
            <button type="button" class="count-btn" data-value="3">3名</button>
            <button type="button" class="count-btn" data-value="4">4名</button>
            <button type="button" class="count-btn" data-value="more">5名以上</button>
          </div>
          <!-- 5名以上の時の詳細数値入力欄 -->
          <input type="number" id="customUserCount" class="input-custom-count" placeholder="具体的な人数を入力（例: 5）" min="5" value="5" style="display: none;">
        </div>

        <!-- 手書きキャンバス -->
        <div class="canvas-container">
          <div style="font-size: 14px; color: #047857; font-weight: bold; margin-bottom: 4px; text-align: left;">✍️ 手書きでお名前を書く場合はこちら：</div>
          <canvas id="sigCanvas" width="320" height="120"></canvas>
          <div class="canvas-tools">
            <span style="font-size: 12px; color: #64748b;">※文字入力か手書きのどちらかで登録できます</span>
            <button type="button" class="btn-clear" onclick="clearCanvas()">やり直す</button>
          </div>
        </div>
      </div>
      <button type="button" class="btn-submit" onclick="registerName()">受付する</button>
    </div>

    <div class="cancel-notice">
      ⚠️ キャンセルの場合は、スタッフまで直接お申し出ください。
    </div>
  </div>

  <div class="card">
    <h2>現在の案内状況</h2>
    <div class="status-box">
      <div>現在の待ち人数</div>
      <div class="status-number" id="totalWaiting">0 組 (0 人)</div>
      <div>全体の残り予想時間: 約 <span id="estimatedTime" style="font-weight: bold;">0</span> 分</div>
    </div>
    
    <h3>現在の待ちリスト</h3>
    <ul id="waitingList"></ul>
  </div>

  <div class="card hold-card" id="holdCard" style="display: none;">
    <h3 style="margin-top: 0; color: #c2410c;">⏳ 保留・ご不在のお客様</h3>
    <p style="font-size: 12px; color: #9a3412; margin-top: -5px;">お呼び出し時にお控えになられなかったお客様です。ご来店の際はお声がけください。</p>
    <ul id="holdList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
    authDomain: "reservationsystem-a3e8d.firebaseapp.com",
    databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
    projectId: "reservationsystem-a3e8d",
    storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
    messagingSenderId: "362167708528",
    appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
    measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings');

  let currentQueue = [];
  let onHoldQueue = [];
  let timePerPerson = 20;
  let shopStartHour = 9;
  let shopEndHour = 18;
  let maxPeopleLimit = 50;

  // 人数選択ロジック
  let selectedCountValue = "1";
  const countBtns = document.querySelectorAll('.count-btn');
  const customCountInput = document.getElementById('customUserCount');

  countBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      countBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedCountValue = e.target.getAttribute('data-value');

      if (selectedCountValue === 'more') {
        customCountInput.style.display = 'block';
        customCountInput.focus();
      } else {
        customCountInput.style.display = 'none';
      }
    });
  });

  function getSelectedCount() {
    if (selectedCountValue === 'more') {
      const val = parseInt(customCountInput.value);
      return (isNaN(val) || val < 1) ? 5 : val;
    }
    return parseInt(selectedCountValue);
  }

  function resetCountSelection() {
    countBtns.forEach(b => b.classList.remove('active'));
    countBtns[0].classList.add('active');
    selectedCountValue = "1";
    customCountInput.style.display = 'none';
    customCountInput.value = '5';
  }

  // 手書きキャンバスの設定
  const canvas = document.getElementById('sigCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let hasDrawn = false;

  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#0f172a';

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: clientX - rect.left,
      y: clientY - rect.top
    };
  }

  function startDraw(e) {
    isDrawing = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    e.preventDefault();
    hasDrawn = true;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDraw() {
    isDrawing = false;
  }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDraw);
  canvas.addEventListener('mouseleave', stopDraw);

  canvas.addEventListener('touchstart', startDraw);
  canvas.addEventListener('touchmove', draw);
  canvas.addEventListener('touchend', stopDraw);

  window.clearCanvas = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  };

  function checkLimit() {
    const now = new Date();
    const currentHour = now.getHours();

    document.getElementById('maxLimitDisplay').textContent = maxPeopleLimit;

    const formEl = document.getElementById('formContainer');
    const closedEl = document.getElementById('closedNotice');
    const limitEl = document.getElementById('limitNotice');
    
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0) + 
                        onHoldQueue.reduce((sum, item) => sum + item.count, 0);

    const isShopOpen = (currentHour >= shopStartHour && currentHour < shopEndHour);

    formEl.style.display = 'none';
    closedEl.style.display = 'none';
    limitEl.style.display = 'none';

    if (!isShopOpen) {
      closedEl.style.display = 'block';
      return false;
    } else if (totalPeople >= maxPeopleLimit) {
      limitEl.style.display = 'block';
      return false;
    } else {
      formEl.style.display = 'block';
      return true;
    }
  }

  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    onHoldQueue = [];

    if (data) {
      Object.keys(data).forEach(key => {
        const item = { 
          id: key, 
          name: data[key].name, 
          nameImage: data[key].nameImage || null,
          count: data[key].count || 1, 
          status: data[key].status || 'waiting' 
        };
        if (item.status === 'hold') {
          onHoldQueue.push(item);
        } else {
          currentQueue.push(item);
        }
      });
    }
    render();
  });

  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.timePerPerson) timePerPerson = data.timePerPerson;
      if (data.shopStartHour !== undefined) shopStartHour = data.shopStartHour;
      if (data.shopEndHour !== undefined) shopEndHour = data.shopEndHour;
      if (data.maxPeopleLimit !== undefined) maxPeopleLimit = data.maxPeopleLimit;
      render();
    }
  });

  window.registerName = () => {
    if (!checkLimit()) {
      return Swal.fire({ icon: 'error', title: '受付不可', text: '現在受付を行っておりません' });
    }

    const nameInput = document.getElementById('userName');
    const name = nameInput.value.trim();
    const count = getSelectedCount();
    let nameImgData = null;

    if (hasDrawn) {
      nameImgData = canvas.toDataURL('image/png');
    }

    if (!name && !hasDrawn) {
      return Swal.fire({ icon: 'warning', title: '入力エラー', text: 'お名前を文字で入力するか、手書きで描いてください' });
    }

    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0) + 
                        onHoldQueue.reduce((sum, item) => sum + item.count, 0);
    if (totalPeople + count > maxPeopleLimit) {
      return Swal.fire({ icon: 'warning', title: '上限オーバー', text: `上限人数（${maxPeopleLimit}名）を超えるため登録できません。` });
    }

    push(queueRef, { 
      name: name || '手書き入力', 
      nameImage: nameImgData,
      count: count, 
      status: 'waiting', 
      createdAt: serverTimestamp() 
    });

    nameInput.value = '';
    resetCountSelection();
    clearCanvas();
    Swal.fire({ icon: 'success', title: '受付完了', text: '受付が完了しました！' });
  };

  function renderNameHTML(item) {
    if (item.nameImage) {
      return `<img src="${item.nameImage}" class="name-img" alt="手書き名"> 様`;
    }
    return `${item.name} 様`;
  }

  function render() {
    checkLimit();

    const totalGroups = currentQueue.length;
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0);

    document.getElementById('totalWaiting').textContent = `${totalGroups} 組 (${totalPeople} 人)`;
    document.getElementById('estimatedTime').textContent = totalPeople * timePerPerson;

    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
    } else {
      let accumulatedPeople = 0;
      currentQueue.forEach((item, index) => {
        const li = document.createElement('li');
        const nameDisp = renderNameHTML(item);

        if (index === 0) {
          li.classList.add('next-item');
          li.innerHTML = `
            <div class="customer-info">
              <span class="badge-next">NEXT</span> 1番目: ${nameDisp} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #059669; font-weight: bold;">[まもなく開始です。店内でお待ちください]</div>
          `;
        } else {
          const waitMinutes = accumulatedPeople * timePerPerson;
          li.innerHTML = `
            <div class="customer-info">
              ${index + 1}番目: ${nameDisp} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #64748b;">（あと約 ${waitMinutes} 分）</div>
          `;
        }
        listElement.appendChild(li);
        accumulatedPeople += item.count;
      });
    }

    const holdCard = document.getElementById('holdCard');
    const holdListElement = document.getElementById('holdList');
    holdListElement.innerHTML = '';

    if (onHoldQueue.length > 0) {
      holdCard.style.display = 'block';
      onHoldQueue.forEach((item) => {
        const li = document.createElement('li');
        const nameDisp = renderNameHTML(item);
        li.innerHTML = `
          <div class="customer-info">
            <span class="hold-badge">保留中</span> ${nameDisp} <span class="nobreak">(${item.count}名)</span>
          </div>
        `;
        holdListElement.appendChild(li);
      });
    } else {
      holdCard.style.display = 'none';
    }
  }
</script>
</body>
</html>
