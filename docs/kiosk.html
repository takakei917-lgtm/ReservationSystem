<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店頭モニター - 待ち時間</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      box-sizing: border-box;
    }

    .monitor-card {
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 20px;
      padding: 40px 24px;
      text-align: center;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .title {
      font-size: 1.5rem;
      color: #94a3b8;
      margin-bottom: 24px;
      letter-spacing: 0.05em;
    }

    .time-display {
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 8px;
      margin: 20px 0;
    }

    .time-num {
      font-size: 6.5rem;
      font-weight: 900;
      color: #f43f5e;
      line-height: 1;
    }

    .time-unit {
      font-size: 2rem;
      font-weight: bold;
      color: #f43f5e;
    }

    .sub-text {
      color: #64748b;
      font-size: 1rem;
      margin-top: 16px;
    }
  </style>
</head>
<body>

<div class="monitor-card">
  <div class="title">ただいまの待ち時間</div>
  <div class="time-display">
    <span class="time-num" id="storeWait">--</span>
    <span class="time-unit">分</span>
  </div>
  <div class="sub-text">お呼び出しまでそのままお待ちください</div>
</div>

<script>
  function fetchWaitTime() {
    const val = localStorage.getItem('app_wait_time') || '15';
    document.getElementById('storeWait').textContent = val;
  }

  // 初期ロードと定期チェック（店員用で更新されたら自動同期）
  window.addEventListener('DOMContentLoaded', () => {
    fetchWaitTime();
    setInterval(fetchWaitTime, 2000);
  });
</script>

</body>
</html>
