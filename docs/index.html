<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>混雑状況確認</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0fdf4;
      color: #166534;
      display: flex;
      justify-content: center;
      padding: 24px 16px;
      margin: 0;
    }

    .net-card {
      background: #ffffff;
      border: 1px solid #bbf7d0;
      border-radius: 16px;
      padding: 32px 20px;
      text-align: center;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
    }

    h1 {
      font-size: 1.1rem;
      color: #15803d;
      margin-bottom: 20px;
    }

    .status-box {
      background: #f0fdf4;
      border-radius: 12px;
      padding: 24px 12px;
      margin: 16px 0;
    }

    .num-wrap {
      margin-top: 8px;
    }

    .num {
      font-size: 4rem;
      font-weight: 800;
      color: #16a34a;
      line-height: 1;
    }

    .unit {
      font-size: 1.2rem;
      font-weight: bold;
      color: #16a34a;
      margin-left: 4px;
    }

    .note {
      font-size: 0.8rem;
      color: #86efac;
      margin-top: 12px;
    }
  </style>
</head>
<body>

<div class="net-card">
  <h1>現在の混雑状況</h1>
  <div class="status-box">
    <div style="font-size: 0.9rem;">ただいまの目安待ち時間</div>
    <div class="num-wrap">
      <span class="num" id="netWait">--</span>
      <span class="unit">分</span>
    </div>
  </div>
  <div class="note">※状況により表示時間が前後する場合がございます</div>
</div>

<script>
  function loadNetWait() {
    const val = localStorage.getItem('app_wait_time') || '15';
    document.getElementById('netWait').textContent = val;
  }

  window.addEventListener('DOMContentLoaded', () => {
    loadNetWait();
    setInterval(loadNetWait, 3000);
  });
</script>

</body>
</html>
