<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>オンライン順番受付</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { 
      --primary: #2563eb; 
      --primary-hover: #1d4ed8;
      --bg: #eff6ff; 
      --card-bg: #ffffff; 
      --text: #0f172a; 
      --border-color: #bfdbfe;
      --hold-border: #f59e0b; 
    }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    
    .container { max-width: 600px; margin: 0 auto; }
    .header-title { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 16px; }
    
    .card { 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      margin-bottom: 16px; 
      box-sizing: border-box;
    }
    .input-group { display: flex; flex-direction: column; gap: 16px; margin-bottom: 12px; }
    
    .input-label { font-size: 14px; color: #1e40af; font-weight: bold; margin-bottom: 6px; }

    input[type="text"], input[type="number"] { 
      padding: 12px; 
      border: 2px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 16px; 
      box-sizing: border-box;
      width: 100%;
    }

    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
      width: 100%;
      box-sizing: border-box;
    }
    
    .canvas-wrapper {
      position: relative;
      border: 2px dashed var(--border-color);
      border-radius: 8px;
      background-color: #ffffff;
      touch-action: none;
      width: 100%; 
      box-sizing: border-box;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 120px;
      cursor: crosshair;
      touch-action: none;
    }

    .btn-clear {
      align-self: flex-end;
      padding: 6px 12px;
      background-color: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .count-selection-area {
      padding-top: 10px;
      border-top: 1px dashed var(--border-color);
    }
    .count-btn-group { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
    .count-btn {
      flex: 1;
      min-width: 45px;
      padding: 10px 4px;
      background-color: #fff;
      color: var(--primary);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .count-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .input-custom-count { margin-top: 8px; }

    .btn-submit { 
      width: 100%; 
      padding: 14px; 
      background-color: var(--primary); 
      color: white; 
      border: none; 
      border-radius: 8px; 
      cursor: pointer; 
      font-size: 18px; 
      font-weight: bold; 
      margin-top: 8px; 
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.2);
    }
    .btn-submit:hover {
      background-color: var(--primary-hover);
    }
    
    .notice-message {
      text-align: center;
      padding: 16px;
      background-color: #fef2f2;
      color: #991b1b;
      border: 1px solid #fecaca;
      border-radius: 8px;
      font-weight: bold;
      font-size: 15px;
    }

    .status-box { text-align: center; padding: 12px; background-color: #dbeafe; border-radius: 8px; }
    .status-number { font-size: 32px; font-weight: bold; color: var(--primary); }
    
    ul { list-style: none; padding: 0; margin: 0; }
    li { 
      padding: 12px; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 8px;
      font-size: 15px;
      word-break: break-all;
    }
    li.next-item { font-weight: bold; background-color: #eff6ff; border-radius: 6px; border-left: 5px solid var(--primary); }
    li.hold-item { background-color: #fef3c7; border-radius: 6px; border-left: 5px solid var(--hold-border); margin-bottom: 6px; }
    
    .badge-next { background-color: var(--primary); color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
    .badge-hold { background-color: #d97706; color: white; padding: 2px 6px; border-radius: 4px; font-size: 12px; margin-right: 4px; }
    
    .customer-info { flex-grow: 1; display: flex; align-items: center; gap: 6px; }
    .handwritten-img { height: 35px; vertical-align: middle; max-width: 140px; object-fit: contain; }
    .nobreak { white-space: nowrap; }
    .time-info { white-space: nowrap; flex-shrink: 0; }

    .hold-section {
      margin-top: 16px;
      padding-top: 12px;
      border-top: 2px dashed #fcd34d;
    }
    .hold-title {
      font-size: 15px;
      font-weight: bold;
      color: #b45309;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="header-title">✂ ヘアカット専門店ankh上石神井店　　ネット受付</h1>

  <!-- 受付カード -->
  <div class="card" id="formCard">
    <!-- メッセージ表示領域 -->
    <div id="noticeContainer" class="notice-message" style="display: none;"></div>

    <!-- フォーム入力エリア -->
    <div id="formContainer">
      <h3 style="margin-top: 0;">お名前と人数を入力してください</h3>
      
      <div class="input-group">
        <div>
          <div class="input-label">⌨️ お名前（文字入力）：</div>
          <input type="text" id="userName" placeholder="お名前を入力">
        </div>

        <div class="canvas-container">
          <div class="input-label">✍️ 手書き（枠内にご記入ください）：</div>
          <div class="canvas-wrapper">
            <canvas id="nameCanvas"></canvas>
          </div>
          <button type="button" class="btn-clear" onclick="clearCanvas()">描き直す（クリア）</button>
        </div>

        <div class="count-selection-area">
          <div class="input-label">👥 ご来店人数：</div>
          <div class="count-btn-group" id="countBtnGroup">
            <button type="button" class="count-btn active" data-value="1">1名</button>
            <button type="button" class="count-btn" data-value="2">2名</button>
            <button type="button" class="count-btn" data-value="3">3名</button>
            <button type="button" class="count-btn" data-value="4">4名</button>
            <button type="button" class="count-btn" data-value="more">5名以上</button>
          </div>
          <input type="number" id="customUserCount" class="input-custom-count" placeholder="人数を入力" min="5" value="5" style="display: none;">
        </div>
      </div>

      <button type="button" class="btn-submit" onclick="registerName()">受付する</button>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top: 0;">現在の案内状況</h3>
    <div class="status-box">
      <div>現在の待ち状況</div>
      <div class="status-number" id="totalWaiting">0 組 (0 人)</div>
      <div>目安時間: 約 <span id="estimatedTime" style="font-weight: bold;">0</span> 分</div>
    </div>
    
    <h4>待ちリスト</h4>
    <ul id="waitingList"></ul>

    <div class="hold-section" id="holdSection" style="display: none;">
      <div class="hold-title">⚠️ お呼び出し時に不在の方（保留中）</div>
      <ul id="holdList"></ul>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
    authDomain: "reservationsystem-a3e8d.firebaseapp.com",
    databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
    projectId: "reservationsystem-a3e8d",
    storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
    messagingSenderId: "362167708528",
    appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
    measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings');

  let currentQueue = [];
  let onHoldQueue = [];
  let timePerPerson = 20;
  
  // 設定変数（店員用画面のキー名と一致）
  let shopStartHour = 9;
  let shopEndHour = 18;
  let netStartHour = 10;
  let netEndHour = 17;
  let maxQueueLimit = 50;
  let netBookingEnabled = true;

  const canvas = document.getElementById('nameCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let hasDrawn = false;
  let lastWidth = 0;

  function initCanvas(forceReset = false) {
    const rect = canvas.parentElement.getBoundingClientRect();
    const newWidth = Math.floor(rect.width);

    if (!forceReset && hasDrawn && Math.abs(newWidth - lastWidth) < 5) {
      return;
    }

    if (newWidth > 0) {
      lastWidth = newWidth;
      canvas.width = newWidth;
      canvas.height = 120;
      
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
    }
  }

  window.addEventListener('load', () => initCanvas(true));
  window.addEventListener('resize', () => initCanvas(false));

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) {
    isDrawing = true;
    hasDrawn = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', (e) => { 
    if (e.target === canvas) e.preventDefault(); 
    startDrawing(e); 
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => { 
    if (e.target === canvas) e.preventDefault(); 
    draw(e); 
  }, { passive: false });

  canvas.addEventListener('touchend', (e) => {
    if (e.target === canvas) e.preventDefault();
    stopDrawing();
  }, { passive: false });

  window.clearCanvas = () => {
    initCanvas(true);
    hasDrawn = false;
  };

  let selectedCountValue = "1";
  const countBtns = document.querySelectorAll('.count-btn');
  const customCountInput = document.getElementById('customUserCount');

  countBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      countBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedCountValue = e.target.getAttribute('data-value');

      if (selectedCountValue === 'more') {
        customCountInput.style.display = 'block';
        customCountInput.focus();
      } else {
        customCountInput.style.display = 'none';
      }
    });
  });

  function getSelectedCount() {
    if (selectedCountValue === 'more') {
      const val = parseInt(customCountInput.value, 10);
      return (isNaN(val) || val < 1) ? 5 : val;
    }
    return parseInt(selectedCountValue, 10);
  }

  function resetCountSelection() {
    countBtns.forEach(b => b.classList.remove('active'));
    countBtns[0].classList.add('active');
    selectedCountValue = "1";
    customCountInput.style.display = 'none';
    customCountInput.value = '5';
  }

  // 受付上限・営業時間等の判定処理
  function checkLimit() {
    const formCard = document.getElementById('formCard');
    const formContainer = document.getElementById('formContainer');
    const noticeContainer = document.getElementById('noticeContainer');

    // 1. ネット受付機能がOFFの場合はカード自体を非表示
    if (!netBookingEnabled) {
      if (formCard) formCard.style.display = 'none';
      return false;
    }
    if (formCard) formCard.style.display = 'block';

    const now = new Date();
    const currentMin = now.getHours() * 60 + now.getMinutes();

    const sStart = Number(shopStartHour);
    const sEnd = Number(shopEndHour);
    const nStart = Number(netStartHour);
    const nEnd = Number(netEndHour);

    // 時間チェック補助関数
    function checkTime(startHour, endHour) {
      if ((startHour === 0 && endHour >= 24) || (startHour === 0 && endHour === 0)) {
        return true;
      }
      const startMin = startHour * 60;
      const endMin = endHour * 60;

      if (startMin > endMin) {
        return (currentMin >= startMin || currentMin < endMin);
      }
      return (currentMin >= startMin && currentMin < endMin);
    }

    const isShopOpen = checkTime(sStart, sEnd);
    const isNetOpen = checkTime(nStart, nEnd);

    // 人数（合計人数）および組数を計算
    const totalGroups = currentQueue.length;
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0);

    // 2. 受付人数上限チェック (店員画面の maxPeopleLimit と同期)
    const isLimitReached = (maxQueueLimit > 0 && (totalGroups >= maxQueueLimit || totalPeople >= maxQueueLimit));

    if (isLimitReached) {
      formContainer.style.display = 'none';
      noticeContainer.style.display = 'block';
      noticeContainer.textContent = 'ただいま待ち人数が上限に達しているため、受付を一時停止しております。';
      return false;
    }

    // 3. ネット受付時間外
    if (!isNetOpen) {
      formContainer.style.display = 'none';
      noticeContainer.style.display = 'block';
      noticeContainer.textContent = 'ただいまオンライン受付時間外です。';
      return false;
    }

    // 4. 店舗営業時間外
    if (!isShopOpen) {
      formContainer.style.display = 'none';
      noticeContainer.style.display = 'block';
      noticeContainer.textContent = '本日の営業は終了しているため、受付を行っておりません。';
      return false;
    }

    // 全条件クリア
    formContainer.style.display = 'block';
    noticeContainer.style.display = 'none';
    return true;
  }

  // 1分ごとに時間の自動チェックを実行（時間切り替え時の反映漏れ防止）
  setInterval(checkLimit, 60000);

  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    onHoldQueue = [];

    if (data) {
      Object.keys(data).forEach(key => {
        const item = { 
          id: key, 
          name: data[key].name || '', 
          nameImage: data[key].nameImage || '', 
          count: parseInt(data[key].count, 10) || 1, 
          status: data[key].status || 'waiting' 
        };
        if (item.status === 'hold') {
          onHoldQueue.push(item);
        } else if (item.status === 'waiting') {
          currentQueue.push(item);
        }
      });
    }
    render();
  });

  // 設定ノードの監視（店員用画面の設定キー名と完全一致化）
  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();

      if (data.timePerPerson !== undefined) timePerPerson = Number(data.timePerPerson);
      if (data.shopStartHour !== undefined) shopStartHour = Number(data.shopStartHour);
      if (data.shopEndHour !== undefined) shopEndHour = Number(data.shopEndHour);
      
      // 店員用のキー名 (startHour, endHour) を参照
      if (data.startHour !== undefined) netStartHour = Number(data.startHour);
      if (data.endHour !== undefined) netEndHour = Number(data.endHour);

      // 店員用のキー名 (maxPeopleLimit) を参照
      if (data.maxPeopleLimit !== undefined) maxQueueLimit = Number(data.maxPeopleLimit);

      if (data.netBookingEnabled !== undefined) {
        netBookingEnabled = Boolean(data.netBookingEnabled);
      } else {
        netBookingEnabled = true;
      }
      
      render();
    }
  });

  window.registerName = () => {
    if (!checkLimit()) return;

    const textName = document.getElementById('userName').value.trim();

    if (!textName && !hasDrawn) {
      return Swal.fire({ icon: 'warning', title: '未入力', text: 'お名前を入力するか、手書きしてください。' });
    }

    let payload = {
      count: getSelectedCount(),
      status: 'waiting',
      createdAt: serverTimestamp()
    };

    if (hasDrawn) {
      payload.nameImage = canvas.toDataURL('image/jpeg', 0.5);
    } else {
      payload.name = textName;
    }

    push(queueRef, payload);

    clearCanvas();
    document.getElementById('userName').value = '';
    resetCountSelection();
    Swal.fire({ icon: 'success', title: '受付完了', text: '順番待ちの受付が完了しました。', confirmButtonColor: '#2563eb' });
  };

  function render() {
    checkLimit();

    const totalGroups = currentQueue.length;
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0);

    document.getElementById('totalWaiting').textContent = `${totalGroups} 組 (${totalPeople} 人)`;
    document.getElementById('estimatedTime').textContent = totalPeople * timePerPerson;

    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
    } else {
      let accumulatedPeople = 0;
      currentQueue.forEach((item, index) => {
        const li = document.createElement('li');

        const nameDisplay = item.nameImage 
          ? `<img src="${item.nameImage}" class="handwritten-img" alt="お名前">` 
          : `${item.name} 様`;

        if (index === 0) {
          li.classList.add('next-item');
          li.innerHTML = `
            <div class="customer-info">
              <span class="badge-next">NEXT</span> 1番目: ${nameDisplay} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #2563eb; font-weight: bold;">[まもなくご案内]</div>
          `;
        } else {
          const waitMinutes = accumulatedPeople * timePerPerson;
          li.innerHTML = `
            <div class="customer-info">
              ${index + 1}番目: ${nameDisplay} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #64748b;">（あと約 ${waitMinutes} 分）</div>
          `;
        }
        listElement.appendChild(li);
        accumulatedPeople += item.count;
      });
    }

    const holdSection = document.getElementById('holdSection');
    const holdListElement = document.getElementById('holdList');
    holdListElement.innerHTML = '';

    if (onHoldQueue.length > 0) {
      holdSection.style.display = 'block';
      onHoldQueue.forEach((item) => {
        const li = document.createElement('li');
        li.classList.add('hold-item');

        const nameDisplay = item.nameImage 
          ? `<img src="${item.nameImage}" class="handwritten-img" alt="お名前">` 
          : `${item.name} 様`;

        li.innerHTML = `
          <div class="customer-info">
            <span class="badge-hold">保留</span> ${nameDisplay} <span class="nobreak">(${item.count}名)</span>
          </div>
          <div class="time-info" style="color: #b45309; font-size: 13px;">戻られ次第ご案内</div>
        `;
        holdListElement.appendChild(li);
      });
    } else {
      holdSection.style.display = 'none';
    }
  }
</script>
</body>
</html>
