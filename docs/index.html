<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【ネット予約】順番待ち受付</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { --primary: #0284c7; --bg: #f0f9ff; --card-bg: #ffffff; --text: #0f172a; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    
    .container { max-width: 600px; margin: 0 auto; }
    .header-title { text-align: center; color: var(--primary); margin-bottom: 20px; }
    
    .card { 
      background: var(--card-bg); 
      padding: 24px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      margin-bottom: 20px; 
      box-sizing: border-box;
    }
    .input-group { display: flex; flex-direction: column; gap: 20px; margin-bottom: 15px; }
    
    .input-label { font-size: 14px; color: #0369a1; font-weight: bold; margin-bottom: 6px; }

    input[type="text"], input[type="number"] { 
      padding: 12px; 
      border: 2px solid #bae6fd; 
      border-radius: 8px; 
      font-size: 18px; 
      box-sizing: border-box;
      width: 100%;
    }

    .canvas-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-top: 10px;
      border-top: 1px dashed #bae6fd;
      width: 100%;
      box-sizing: border-box;
    }
    
    .canvas-wrapper {
      position: relative;
      border: 2px dashed #bae6fd;
      border-radius: 8px;
      background-color: #ffffff;
      touch-action: none;
      width: 100%; 
      box-sizing: border-box;
      overflow: hidden;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 120px;
      cursor: crosshair;
    }

    .btn-clear {
      align-self: flex-end;
      padding: 6px 12px;
      background-color: #64748b;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
    }

    .count-selection-area {
      padding-top: 10px;
      border-top: 1px dashed #bae6fd;
    }
    .count-btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .count-btn {
      flex: 1;
      min-width: 50px;
      padding: 12px 5px;
      background-color: #fff;
      color: var(--primary);
      border: 2px solid #bae6fd;
      border-radius: 8px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .count-btn.active {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .input-custom-count { margin-top: 8px; }

    .btn-submit { width: 100%; padding: 15px; background-color: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 20px; font-weight: bold; margin-top: 10px; }
    .status-box { text-align: center; padding: 15px; background-color: #e0f2fe; border-radius: 8px; }
    .status-number { font-size: 36px; font-weight: bold; color: var(--primary); }
    
    .notice-box { padding: 20px; border-radius: 12px; text-align: center; font-weight: bold; font-size: 18px; margin-bottom: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
    .limit-notice { background-color: #fee2e2; border: 1px solid #ef4444; color: #991b1b; }
    .closed-notice { background-color: #f3f4f6; border: 1px solid #9ca3af; color: #374151; }
    .shop-closed-notice { background-color: #e2e8f0; border: 1px solid #64748b; color: #1e293b; }
    
    ul { list-style: none; padding: 0; }
    li { 
      padding: 12px; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 10px;
      word-break: break-all;
    }
    li.next-item { font-weight: bold; background-color: #f0f9ff; border-radius: 6px; border-left: 5px solid var(--primary); }
    .badge-next { background-color: var(--primary); color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; margin-right: 5px; display: inline-block; }
    
    .customer-info { flex-grow: 1; display: flex; align-items: center; gap: 8px; }
    .handwritten-img { height: 35px; vertical-align: middle; max-width: 150px; object-fit: contain; }
    .nobreak { white-space: nowrap; }
    .time-info { white-space: nowrap; flex-shrink: 0; }

    @media (max-width: 480px) {
      li { flex-direction: column; align-items: flex-start; }
      .time-info { align-self: flex-end; font-size: 14px; }
    }
  </style>
</head>
<body>

<div class="container">
  <h1 class="header-title">📱 オンライン順番待ち受付</h1>

  <!-- 各状態に対応するメッセージ表示領域 -->
  <div id="shopClosedNotice" class="notice-box shop-closed-notice" style="display: none;">本日の営業は終了いたしました。</div>
  <div id="closedNotice" class="notice-box closed-notice" style="display: none;">本日のネット予約受付時間は終了いたしました。</div>
  <div id="limitNotice" class="notice-box limit-notice" style="display: none;">受付上限人数（<span id="maxLimitDisplay">50</span>名）に達したため、現在の受付は一時的に終了いたしました。</div>

  <!-- 受付用フォームカード -->
  <div class="card" id="formCard">
    <h2>お名前と人数を入力してください</h2>
    
    <div id="formContainer">
      <div class="input-group">
        <div>
          <div class="input-label">⌨️ お名前（文字入力）：</div>
          <input type="text" id="userName" placeholder="お名前を入力（例: 山田）">
        </div>

        <div class="canvas-container">
          <div class="input-label">✍️ 手書きの場合はこちら（枠内にご記入）：</div>
          <div class="canvas-wrapper">
            <canvas id="nameCanvas"></canvas>
          </div>
          <button type="button" class="btn-clear" onclick="clearCanvas()">描き直す（クリア）</button>
        </div>

        <div class="count-selection-area">
          <div class="input-label">👥 人数を選択してください：</div>
          <div class="count-btn-group" id="countBtnGroup">
            <button type="button" class="count-btn active" data-value="1">1名</button>
            <button type="button" class="count-btn" data-value="2">2名</button>
            <button type="button" class="count-btn" data-value="3">3名</button>
            <button type="button" class="count-btn" data-value="4">4名</button>
            <button type="button" class="count-btn" data-value="more">5名以上</button>
          </div>
          <input type="number" id="customUserCount" class="input-custom-count" placeholder="具体的な人数を入力（例: 5）" min="5" value="5" style="display: none;">
        </div>
      </div>

      <button type="button" class="btn-submit" onclick="registerName()">順番待ちを申込む</button>
    </div>
  </div>

  <div class="card">
    <h2>現在の案内状況</h2>
    <div class="status-box">
      <div>現在の待ち人数</div>
      <div class="status-number" id="totalWaiting">0 組 (0 人)</div>
      <div>全体の残り予想時間: 約 <span id="estimatedTime" style="font-weight: bold;">0</span> 分</div>
    </div>
    
    <h3>現在の待ちリスト</h3>
    <ul id="waitingList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
    authDomain: "reservationsystem-a3e8d.firebaseapp.com",
    databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
    projectId: "reservationsystem-a3e8d",
    storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
    messagingSenderId: "362167708528",
    appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
    measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings');

  let currentQueue = [];
  let onHoldQueue = [];
  let timePerPerson = 20;
  let shopStartHour = 9;
  let shopEndHour = 18;
  let startHour = 9;
  let endHour = 18;
  let maxPeopleLimit = 50;
  let netBookingEnabled = true;

  const canvas = document.getElementById('nameCanvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let hasDrawn = false;

  function resizeCanvas() {
    const rect = canvas.parentElement.getBoundingClientRect();
    if (rect.width > 0) {
      canvas.width = rect.width;
      canvas.height = 120;
      
      // 背景を白で塗りつぶす（画像の黒化を防止）
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.strokeStyle = '#0f172a';
    }
  }

  window.addEventListener('load', resizeCanvas);
  window.addEventListener('resize', resizeCanvas);

  function getPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDrawing(e) {
    isDrawing = true;
    hasDrawn = true;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getPos(e);
    ctx.lineTo(pos.x, pos.y);
    ctx.stroke();
  }

  function stopDrawing() { isDrawing = false; }

  canvas.addEventListener('mousedown', startDrawing);
  canvas.addEventListener('mousemove', draw);
  canvas.addEventListener('mouseup', stopDrawing);
  canvas.addEventListener('mouseleave', stopDrawing);

  canvas.addEventListener('touchstart', (e) => { e.preventDefault(); startDrawing(e); }, { passive: false });
  canvas.addEventListener('touchmove', (e) => { e.preventDefault(); draw(e); }, { passive: false });
  canvas.addEventListener('touchend', stopDrawing);

  // クリア時も白で塗りつぶす
  window.clearCanvas = () => {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    hasDrawn = false;
  };

  let selectedCountValue = "1";
  const countBtns = document.querySelectorAll('.count-btn');
  const customCountInput = document.getElementById('customUserCount');

  countBtns.forEach(btn => {
    btn.addEventListener('click', (e) => {
      countBtns.forEach(b => b.classList.remove('active'));
      e.target.classList.add('active');
      selectedCountValue = e.target.getAttribute('data-value');

      if (selectedCountValue === 'more') {
        customCountInput.style.display = 'block';
        customCountInput.focus();
      } else {
        customCountInput.style.display = 'none';
      }
    });
  });

  function getSelectedCount() {
    if (selectedCountValue === 'more') {
      const val = parseInt(customCountInput.value);
      return (isNaN(val) || val < 1) ? 5 : val;
    }
    return parseInt(selectedCountValue);
  }

  function resetCountSelection() {
    countBtns.forEach(b => b.classList.remove('active'));
    countBtns[0].classList.add('active');
    selectedCountValue = "1";
    customCountInput.style.display = 'none';
    customCountInput.value = '5';
  }

  function checkLimit() {
    const now = new Date();
    const currentHour = now.getHours();

    document.getElementById('maxLimitDisplay').textContent = maxPeopleLimit;

    const formCard = document.getElementById('formCard');
    const shopClosedEl = document.getElementById('shopClosedNotice');
    const closedEl = document.getElementById('closedNotice');
    const limitEl = document.getElementById('limitNotice');
    
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0) + 
                        onHoldQueue.reduce((sum, item) => sum + item.count, 0);

    const isShopOpen = (currentHour >= shopStartHour && currentHour < shopEndHour);
    const isNetOpen = (currentHour >= startHour && currentHour < endHour);

    // すべての要素を一旦初期化（非表示）
    formCard.style.display = 'none';
    shopClosedEl.style.display = 'none';
    closedEl.style.display = 'none';
    limitEl.style.display = 'none';

    // 1. 最優先：ネット予約自体がOFF
    if (netBookingEnabled === false) {
      return false;
    } 
    // 2. 営業時間外
    else if (!isShopOpen) {
      shopClosedEl.style.display = 'block';
      return false;
    } 
    // 3. ネット受付時間外
    else if (!isNetOpen) {
      closedEl.style.display = 'block';
      return false;
    } 
    // 4. 人数上限オーバー
    else if (totalPeople >= maxPeopleLimit) {
      limitEl.style.display = 'block';
      return false;
    } 
    // 5. 通常受付中
    else {
      formCard.style.display = 'block';
      return true;
    }
  }

  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    onHoldQueue = [];

    if (data) {
      Object.keys(data).forEach(key => {
        const item = { 
          id: key, 
          name: data[key].name || '', 
          nameImage: data[key].nameImage || '', 
          count: data[key].count || 1, 
          status: data[key].status || 'waiting' 
        };
        if (item.status === 'hold') {
          onHoldQueue.push(item);
        } else {
          currentQueue.push(item);
        }
      });
    }
    render();
  });

  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.timePerPerson !== undefined) timePerPerson = data.timePerPerson;
      if (data.shopStartHour !== undefined) shopStartHour = data.shopStartHour;
      if (data.shopEndHour !== undefined) shopEndHour = data.shopEndHour;
      if (data.startHour !== undefined) startHour = data.startHour;
      if (data.endHour !== undefined) endHour = data.endHour;
      if (data.maxPeopleLimit !== undefined) maxPeopleLimit = data.maxPeopleLimit;
      
      if (data.netBookingEnabled !== undefined) {
        netBookingEnabled = data.netBookingEnabled;
      } else if (data.isAccepting !== undefined) {
        netBookingEnabled = data.isAccepting;
      }
      
      render();
    }
  });

  window.registerName = () => {
    if (!checkLimit()) {
      return Swal.fire({ icon: 'error', title: '受付不可', text: '現在ネット受付を行っておりません' });
    }

    const textName = document.getElementById('userName').value.trim();

    if (!textName && !hasDrawn) {
      return Swal.fire({ icon: 'warning', title: '入力エラー', text: 'お名前を入力するか、枠内に手書きしてください' });
    }

    let payload = {
      count: getSelectedCount(),
      status: 'waiting',
      createdAt: serverTimestamp()
    };

    if (hasDrawn) {
      payload.nameImage = canvas.toDataURL('image/jpeg', 0.5);
    } else {
      payload.name = textName;
    }

    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0) + 
                        onHoldQueue.reduce((sum, item) => sum + item.count, 0);
    if (totalPeople + payload.count > maxPeopleLimit) {
      return Swal.fire({ icon: 'warning', title: '上限オーバー', text: `上限人数（${maxPeopleLimit}名）を超えるため登録できません。` });
    }

    push(queueRef, payload);

    clearCanvas();
    document.getElementById('userName').value = '';
    resetCountSelection();
    Swal.fire({ icon: 'success', title: '受付完了', text: 'ネットからの順番待ち申込みが完了しました！', confirmButtonColor: '#0284c7' });
  };

  function render() {
    checkLimit();

    const totalGroups = currentQueue.length;
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0);

    document.getElementById('totalWaiting').textContent = `${totalGroups} 組 (${totalPeople} 人)`;
    document.getElementById('estimatedTime').textContent = totalPeople * timePerPerson;

    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
    } else {
      let accumulatedPeople = 0;
      currentQueue.forEach((item, index) => {
        const li = document.createElement('li');

        const nameDisplay = item.nameImage 
          ? `<img src="${item.nameImage}" class="handwritten-img" alt="お名前">` 
          : `${item.name} 様`;

        if (index === 0) {
          li.classList.add('next-item');
          li.innerHTML = `
            <div class="customer-info">
              <span class="badge-next">NEXT</span> 1番目: ${nameDisplay} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #0284c7; font-weight: bold;">[まもなくご案内]</div>
          `;
        } else {
          const waitMinutes = accumulatedPeople * timePerPerson;
          li.innerHTML = `
            <div class="customer-info">
              ${index + 1}番目: ${nameDisplay} <span class="nobreak">(${item.count}名)</span>
            </div>
            <div class="time-info" style="color: #64748b;">（あと約 ${waitMinutes} 分）</div>
          `;
        }
        listElement.appendChild(li);
        accumulatedPeople += item.count;
      });
    }
  }
</script>
</body>
</html>
