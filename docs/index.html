<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>順番待ち受付システム (人数対応版)</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1, h2 { text-align: center; color: var(--primary); }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }
    input[type="text"], input[type="number"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
    .input-name { flex: 2; min-width: 150px; }
    .input-count { flex: 1; min-width: 80px; }
    button { padding: 10px 16px; background-color: var(--primary); color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    button.btn-danger { background-color: #dc2626; }
    .status-box { text-align: center; padding: 15px; background-color: #eff6ff; border-radius: 8px; }
    .status-number { font-size: 36px; font-weight: bold; color: var(--primary); }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    li:first-child { font-weight: bold; background-color: #f1f5f9; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>✂️ 床屋の順番待ち</h1>

  <!-- お客様用：受付フォーム -->
  <div class="card">
    <h2>受付（順番待ち登録）</h2>
    <div class="input-group">
      <input type="text" id="userName" class="input-name" placeholder="お名前">
      <input type="number" id="userCount" class="input-count" value="1" min="1" placeholder="人数">
      <button onclick="registerName()">登録</button>
    </div>
  </div>

  <!-- お客様用：現在の全体状況 -->
  <div class="card">
    <h2>現在の案内状況</h2>
    <div class="status-box">
      <div>現在の待ち人数</div>
      <div class="status-number" id="totalWaiting">0 組 (0 人)</div>
      <div>およその待ち時間: <span id="estimatedTime" style="font-weight: bold;">0</span> 分</div>
    </div>
  </div>

  <!-- 店員用：管理パネル -->
  <div class="card">
    <h2>【店員用】管理画面</h2>
    <div class="input-group">
      <label style="line-height: 40px;">1人あたりの目安時間(分):</label>
      <input type="number" id="timePerPerson" value="20" min="1" style="max-width: 80px;" onchange="updateSettings()">
    </div>
    <button class="btn-danger" style="width: 100%; margin-bottom: 15px;" onclick="nextCustomer()">1組 施術完了（先頭を消去）</button>
    
    <h3>現在の待ちリスト</h3>
    <ul id="waitingList"></ul>
  </div>
</div>

<!-- Firebase SDKの読み込み -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, push, onValue, remove, set, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ★ご自身のFirebase設定情報に書き換えてください★
  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
  authDomain: "reservationsystem-a3e8d.firebaseapp.com",
  databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
  projectId: "reservationsystem-a3e8d",
  storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
  messagingSenderId: "362167708528",
  appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
  measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings/timePerPerson');

  let currentQueue = [];
  let timePerPerson = 20;

  // リアルタイムデータ監視（待ちリスト）
  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    if (data) {
      Object.keys(data).forEach(key => {
        currentQueue.push({ 
          id: key, 
          name: data[key].name, 
          count: data[key].count || 1 
        });
      });
    }
    render();
  });

  // リアルタイムデータ監視（設定時間）
  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      timePerPerson = snapshot.val();
      document.getElementById('timePerPerson').value = timePerPerson;
      render();
    }
  });

  // 順番登録
  window.registerName = () => {
    const nameInput = document.getElementById('userName');
    const countInput = document.getElementById('userCount');
    
    const name = nameInput.value.trim();
    const count = parseInt(countInput.value) || 1;

    if (!name) return alert('お名前を入力してください');

    push(queueRef, {
      name: name,
      count: count,
      createdAt: serverTimestamp()
    });
    
    nameInput.value = '';
    countInput.value = '1';
  };

  // 先頭の消去処理
  window.nextCustomer = () => {
    if (currentQueue.length === 0) return alert('待っているお客様はいません');
    const firstPerson = currentQueue[0];
    remove(ref(db, `queue/${firstPerson.id}`));
  };

  // 設定時間の変更保存
  window.updateSettings = () => {
    const val = parseInt(document.getElementById('timePerPerson').value) || 20;
    set(settingsRef, val);
  };

  // 画面の更新
  function render() {
    // 全体の「組数」と「合計人数」を計算
    const totalGroups = currentQueue.length;
    const totalPeople = currentQueue.reduce((sum, item) => sum + item.count, 0);

    document.getElementById('totalWaiting').textContent = `${totalGroups} 組 (${totalPeople} 人)`;
    // 待ち時間＝「全体の合計人数 × 1人あたりの目安時間」
    document.getElementById('estimatedTime').textContent = totalPeople * timePerPerson;

    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
      return;
    }

    // 各グループの「自分の前までの合計人数」を算出して個別の待ち時間を出す
    let accumulatedPeople = 0;
    currentQueue.forEach((item, index) => {
      const li = document.createElement('li');
      const waitMinutes = accumulatedPeople * timePerPerson;
      
      li.textContent = `${index + 1}番目: ${item.name} 様 (${item.count}名) （あと約 ${waitMinutes} 分）`;
      listElement.appendChild(li);

      accumulatedPeople += item.count;
    });
  }
</script>

</body>
</html>
