<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【管理用】順番待ち管理</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1, h2 { text-align: center; color: #dc2626; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .input-group { display: flex; gap: 10px; margin-bottom: 15px; }
    input[type="number"] { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; }
    button { padding: 15px 16px; background-color: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 18px; font-weight: bold; width: 100%; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    li:first-child { font-weight: bold; background-color: #fee2e2; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔒 【店員専用】管理画面</h1>

  <div class="card">
    <div class="input-group">
      <label style="line-height: 40px;">1人あたりの目安時間(分):</label>
      <input type="number" id="timePerPerson" value="20" min="1" style="max-width: 80px;" onchange="updateSettings()">
    </div>
    
    <button onclick="nextCustomer()">1人 施術完了（先頭を減算/削除）</button>
  </div>

  <div class="card">
    <h2>現在の順番待ち一覧</h2>
    <ul id="waitingList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ★ご自身のFirebase設定情報★
  const firebaseConfig = {
   apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
  authDomain: "reservationsystem-a3e8d.firebaseapp.com",
  databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
  projectId: "reservationsystem-a3e8d",
  storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
  messagingSenderId: "362167708528",
  appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
  measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings/timePerPerson');

  let currentQueue = [];

  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    if (data) {
      Object.keys(data).forEach(key => {
        currentQueue.push({ id: key, name: data[key].name, count: data[key].count || 1 });
      });
    }
    render();
  });

  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      document.getElementById('timePerPerson').value = snapshot.val();
    }
  });

  window.nextCustomer = () => {
    if (currentQueue.length === 0) return alert('待っているお客様はいません');
    const firstPerson = currentQueue[0];

    if (firstPerson.count > 1) {
      update(ref(db, `queue/${firstPerson.id}`), { count: firstPerson.count - 1 });
    } else {
      remove(ref(db, `queue/${firstPerson.id}`));
    }
  };

  window.updateSettings = () => {
    const val = parseInt(document.getElementById('timePerPerson').value) || 20;
    set(settingsRef, val);
  };

  function render() {
    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
      return;
    }

    currentQueue.forEach((item, index) => {
      const li = document.createElement('li');
      li.textContent = `${index + 1}番目: ${item.name} 様 （${item.count}名）`;
      listElement.appendChild(li);
    });
  }
</script>
</body>
</html>
