<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【管理用】順番待ち管理</title>
  <style>
    :root { --primary: #1e3a8a; --bg: #f8fafc; --card-bg: #ffffff; --text: #0f172a; }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    .container { max-width: 600px; margin: 0 auto; }
    h1, h2 { text-align: center; color: #dc2626; }
    .card { background: var(--card-bg); padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    input[type="number"] { padding: 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 16px; width: 70px; }
    button { padding: 10px 16px; background-color: #dc2626; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 16px; font-weight: bold; }
    .btn-main { width: 100%; padding: 15px; font-size: 18px; margin-top: 10px; }
    .btn-cancel { background-color: #64748b; padding: 6px 12px; font-size: 12px; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
    li:first-child { font-weight: bold; background-color: #fee2e2; border-radius: 6px; }
  </style>
</head>
<body>

<div class="container">
  <h1>🔒 【店員専用】管理画面</h1>

  <div class="card">
    <h2>システム設定</h2>
    <div class="setting-row">
      <label>1人あたりの目安時間:</label>
      <div><input type="number" id="timePerPerson" value="20" min="1"> 分</div>
    </div>
    <div class="setting-row">
      <label>ネット受付 開始時間:</label>
      <div><input type="number" id="startHour" value="10" min="0" max="23"> 時</div>
    </div>
    <div class="setting-row">
      <label>ネット受付 終了時間:</label>
      <div><input type="number" id="endHour" value="17" min="0" max="24"> 時</div>
    </div>
    <button style="width: 100%; background-color: #2563eb; margin-top: 5px;" onclick="saveSettings()">設定を保存</button>
  </div>

  <div class="card">
    <h2>案内操作</h2>
    <button class="btn-main" onclick="nextCustomer()">1人 施術完了（先頭を減算/削除）</button>
  </div>

  <div class="card">
    <h2>現在の順番待ち一覧</h2>
    <ul id="waitingList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, remove, set, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  // ★ご自身のFirebase設定情報★
  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
  authDomain: "reservationsystem-a3e8d.firebaseapp.com",
  databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
  projectId: "reservationsystem-a3e8d",
  storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
  messagingSenderId: "362167708528",
  appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
  measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings');

  let currentQueue = [];

  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    if (data) {
      Object.keys(data).forEach(key => {
        currentQueue.push({ id: key, name: data[key].name, count: data[key].count || 1 });
      });
    }
    render();
  });

  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.timePerPerson) document.getElementById('timePerPerson').value = data.timePerPerson;
      if (data.startHour !== undefined) document.getElementById('startHour').value = data.startHour;
      if (data.endHour !== undefined) document.getElementById('endHour').value = data.endHour;
    }
  });

  window.saveSettings = () => {
    const timeVal = parseInt(document.getElementById('timePerPerson').value) || 20;
    const startVal = parseInt(document.getElementById('startHour').value) || 10;
    const endVal = parseInt(document.getElementById('endHour').value) || 17;

    set(settingsRef, {
      timePerPerson: timeVal,
      startHour: startVal,
      endHour: endVal
    });
    alert('設定を保存しました');
  };

  window.nextCustomer = () => {
    if (currentQueue.length === 0) return alert('待っているお客様はいません');
    const firstPerson = currentQueue[0];

    if (firstPerson.count > 1) {
      update(ref(db, `queue/${firstPerson.id}`), { count: firstPerson.count - 1 });
    } else {
      remove(ref(db, `queue/${firstPerson.id}`));
    }
  };

  window.cancelCustomer = (id, name) => {
    if (confirm(`${name} 様の予約をキャンセル（削除）しますか？`)) {
      remove(ref(db, `queue/${id}`));
    }
  };

  function render() {
    const listElement = document.getElementById('waitingList');
    listElement.innerHTML = '';

    if (currentQueue.length === 0) {
      listElement.innerHTML = '<li>現在待ちなし</li>';
      return;
    }

    currentQueue.forEach((item, index) => {
      const li = document.createElement('li');
      li.innerHTML = `
        <span>${index + 1}番目: ${item.name} 様 （${item.count}名）</span>
        <button class="btn-cancel" onclick="cancelCustomer('${item.id}', '${item.name}')">取消</button>
      `;
      listElement.appendChild(li);
    });
  }
</script>
</body>
</html>
