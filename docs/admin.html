<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>店員用 管理画面</title>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>
    :root { 
      --primary: #1e3a8a;
      --primary-hover: #1e40af;
      --bg: #f8fafc; 
      --card-bg: #ffffff; 
      --text: #0f172a; 
      --border-color: #cbd5e1;
      --success: #16a34a;
      --warning: #d97706;
      --danger: #dc2626;
    }
    body { font-family: sans-serif; background-color: var(--bg); color: var(--text); margin: 0; padding: 16px; }
    
    .container { max-width: 800px; margin: 0 auto; }
    .header-title { text-align: center; color: var(--primary); font-size: 24px; margin-bottom: 16px; }
    
    .card { 
      background: var(--card-bg); 
      padding: 20px; 
      border-radius: 12px; 
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); 
      margin-bottom: 16px; 
      box-sizing: border-box;
    }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }

    .input-label { font-size: 14px; color: var(--primary); font-weight: bold; margin-bottom: 6px; }

    input[type="number"] { 
      padding: 10px; 
      border: 2px solid var(--border-color); 
      border-radius: 8px; 
      font-size: 16px; 
      box-sizing: border-box;
      width: 100%;
    }

    .btn {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      transition: background-color 0.2s;
    }
    .btn-primary { background-color: var(--primary); }
    .btn-primary:hover { background-color: var(--primary-hover); }
    .btn-success { background-color: var(--success); }
    .btn-warning { background-color: var(--warning); }
    .btn-danger { background-color: var(--danger); }

    ul { list-style: none; padding: 0; margin: 0; }
    li { 
      padding: 14px; 
      border-bottom: 1px solid #e2e8f0; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      gap: 12px;
      font-size: 16px;
      flex-wrap: wrap;
    }
    li:last-child { border-bottom: none; }
    
    .customer-info { flex-grow: 1; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .handwritten-img { height: 40px; vertical-align: middle; max-width: 160px; object-fit: contain; }
    .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }

    .badge-num {
      background-color: var(--primary);
      color: white;
      padding: 4px 8px;
      border-radius: 6px;
      font-weight: bold;
      font-size: 14px;
    }

    .setting-row { margin-bottom: 12px; }
  </style>
</head>
<body>

<div class="container">
  <h1 class="header-title">📋 店舗用 順番管理画面</h1>

  <!-- 設定変更エリア -->
  <div class="card">
    <h3 style="margin-top: 0; color: var(--primary);">⚙️ 営業時間・所要時間の設定</h3>
    <div class="grid-2">
      <div class="setting-row">
        <div class="input-label">1人あたりの所要時間（分）:</div>
        <input type="number" id="settingTimePerPerson" min="1" value="20">
      </div>
      <div class="setting-row">
        <div class="input-label">店頭受付 開始時間（時）:</div>
        <input type="number" id="settingShopStartHour" min="0" max="23" value="9">
      </div>
      <div class="setting-row">
        <div class="input-label">店頭受付 終了時間（時）:</div>
        <input type="number" id="settingShopEndHour" min="0" max="23" value="18">
      </div>
      <div class="setting-row">
        <div class="input-label">ネット予約 開始時間（時）:</div>
        <input type="number" id="settingOnlineStartHour" min="0" max="23" value="10">
      </div>
    </div>
    <button type="button" class="btn btn-primary" style="margin-top: 10px; width: 100%;" onclick="saveSettings()">設定を保存する</button>
  </div>

  <!-- 現在の待ちリスト -->
  <div class="card">
    <h3 style="margin-top: 0;">⏳ 待ちリスト</h3>
    <ul id="waitingList"></ul>
  </div>

  <!-- 保留中リスト -->
  <div class="card">
    <h3 style="margin-top: 0; color: var(--warning);">⚠️ 保留中リスト</h3>
    <ul id="holdList"></ul>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBa1DxQOAAaPp6TZunW5XyX2iE95AQWYZc",
    authDomain: "reservationsystem-a3e8d.firebaseapp.com",
    databaseURL: "https://reservationsystem-a3e8d-default-rtdb.firebaseio.com",
    projectId: "reservationsystem-a3e8d",
    storageBucket: "reservationsystem-a3e8d.firebasestorage.app",
    messagingSenderId: "362167708528",
    appId: "1:362167708528:web:b0fdbfca090f0b83eb7db5",
    measurementId: "G-FREYRL5GKT"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  const queueRef = ref(db, 'queue');
  const settingsRef = ref(db, 'settings');

  let currentQueue = [];
  let onHoldQueue = [];

  // キュー（予約データ）の監視
  onValue(queueRef, (snapshot) => {
    const data = snapshot.val();
    currentQueue = [];
    onHoldQueue = [];

    if (data) {
      Object.keys(data).forEach(key => {
        const item = { 
          id: key, 
          name: data[key].name || '', 
          nameImage: data[key].nameImage || '', 
          count: data[key].count || 1, 
          status: data[key].status || 'waiting',
          createdAt: data[key].createdAt || 0
        };
        if (item.status === 'hold') {
          onHoldQueue.push(item);
        } else if (item.status === 'waiting') {
          currentQueue.push(item);
        }
      });
      // 作成日時でソート
      currentQueue.sort((a, b) => a.createdAt - b.createdAt);
      onHoldQueue.sort((a, b) => a.createdAt - b.createdAt);
    }
    render();
  });

  // 設定の監視・読み込み
  onValue(settingsRef, (snapshot) => {
    if (snapshot.exists()) {
      const data = snapshot.val();
      if (data.timePerPerson !== undefined) document.getElementById('settingTimePerPerson').value = data.timePerPerson;
      if (data.shopStartHour !== undefined) document.getElementById('settingShopStartHour').value = data.shopStartHour;
      if (data.shopEndHour !== undefined) document.getElementById('settingShopEndHour').value = data.shopEndHour;
      if (data.onlineStartHour !== undefined) document.getElementById('settingOnlineStartHour').value = data.onlineStartHour;
    }
  });

  // 設定保存関数
  window.saveSettings = async () => {
    const timePerPerson = Number(document.getElementById('settingTimePerPerson').value);
    const shopStartHour = Number(document.getElementById('settingShopStartHour').value);
    const shopEndHour = Number(document.getElementById('settingShopEndHour').value);
    const onlineStartHour = Number(document.getElementById('settingOnlineStartHour').value);

    try {
      await set(settingsRef, {
        timePerPerson,
        shopStartHour,
        shopEndHour,
        onlineStartHour
      });
      Swal.fire({ icon: 'success', title: '保存完了', text: '設定を変更しました。', timer: 1500, showConfirmButton: false });
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'エラー', text: '保存に失敗しました。' });
    }
  };

  // ステータス更新（案内完了や保留への変更）
  window.updateStatus = async (id, status) => {
    try {
      if (status === 'completed') {
        await remove(ref(db, `queue/${id}`));
      } else {
        await update(ref(db, `queue/${id}`), { status });
      }
    } catch (e) {
      Swal.fire({ icon: 'error', title: 'エラー', text: '操作に失敗しました。' });
    }
  };

  // 削除確認
  window.confirmDelete = (id) => {
    Swal.fire({
      title: '本当に削除しますか？',
      text: "この操作は取り消せません。",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#dc2626',
      cancelButtonColor: '#64748b',
      confirmButtonText: '削除する',
      cancelButtonText: 'キャンセル'
    }).then((result) => {
      if (result.isConfirmed) {
        remove(ref(db, `queue/${id}`));
      }
    });
  };

  // 画面描画
  function render() {
    // 待ちリスト描画
    const waitingListEl = document.getElementById('waitingList');
    waitingListEl.innerHTML = '';

    if (currentQueue.length === 0) {
      waitingListEl.innerHTML = '<li>現在待ちの件数はありません。</li>';
    } else {
      currentQueue.forEach((item, index) => {
        const li = document.createElement('li');
        const nameDisplay = item.nameImage 
          ? `<img src="${item.nameImage}" class="handwritten-img" alt="お名前">` 
          : `<strong>${item.name}</strong> 様`;

        li.innerHTML = `
          <div class="customer-info">
            <span class="badge-num">${index + 1}</span>
            ${nameDisplay} (${item.count}名)
          </div>
          <div class="btn-group">
            <button class="btn btn-success" onclick="updateStatus('${item.id}', 'completed')">案内完了</button>
            <button class="btn btn-warning" onclick="updateStatus('${item.id}', 'hold')">保留</button>
            <button class="btn btn-danger" onclick="confirmDelete('${item.id}')">削除</button>
          </div>
        `;
        waitingListEl.appendChild(li);
      });
    }

    // 保留リスト描画
    const holdListEl = document.getElementById('holdList');
    holdListEl.innerHTML = '';

    if (onHoldQueue.length === 0) {
      holdListEl.innerHTML = '<li>現在保留中の件数はありません。</li>';
    } else {
      onHoldQueue.forEach((item) => {
        const li = document.createElement('li');
        const nameDisplay = item.nameImage 
          ? `<img src="${item.nameImage}" class="handwritten-img" alt="お名前">` 
          : `<strong>${item.name}</strong> 様`;

        li.innerHTML = `
          <div class="customer-info">
            ${nameDisplay} (${item.count}名)
          </div>
          <div class="btn-group">
            <button class="btn btn-primary" onclick="updateStatus('${item.id}', 'waiting')">待ちへ戻す</button>
            <button class="btn btn-success" onclick="updateStatus('${item.id}', 'completed')">案内完了</button>
            <button class="btn btn-danger" onclick="confirmDelete('${item.id}')">削除</button>
          </div>
        `;
        holdListEl.appendChild(li);
      });
    }
  }
</script>
</body>
</html>
